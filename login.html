<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#090D14">
    <title>Locked | Life OS</title>
<style>
  :root {
    --bg: #0b0f17; --card: #131b2e; --line: #1e293b; --text: #f1f5f9; --muted: #94a3b8;
    --accent: #22c55e; --accent-hover: #16a34a; --danger: #f87171;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    display: grid; place-items: center; padding: 24px;
  }
  main { width: 100%; max-width: 380px; }
  .clock { font-size: 56px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; margin: 8px 0 32px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: grid; gap: 16px; }
  label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  input {
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); font: inherit; font-size: 16px; padding: 11px 12px; width: 100%;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    background: var(--accent); color: #04130a; border: 0; border-radius: 10px;
    font: inherit; font-weight: 700; padding: 12px; cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: wait; }
  #error { color: var(--danger); font-size: 13px; min-height: 18px; margin: 0; }
  .note { color: var(--muted); font-size: 12px; margin: 16px 4px 0; }
</style>
</head>
<body>
<main>
  <p class="clock" id="clock">--:--</p>
  <p class="sub">Life OS is locked.</p>
  <form id="login-form" autocomplete="on" novalidate>
    <label>Username
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </label>
    <label>Password
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </label>
    <p id="error" role="alert" aria-live="polite"></p>
    <button type="submit" id="submit">Unlock</button>
  </form>
  <p class="note">Your session ends when you close the browser and expires automatically.</p>
</main>
<script>
  const clock = document.getElementById('clock');
  const tick = () => { clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }); };
  tick(); setInterval(tick, 1000);

  const form = document.getElementById('login-form');
  const err = document.getElementById('error');
  const btn = document.getElementById('submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true; btn.textContent = 'Checking…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      if (res.ok) { window.location.replace('/'); return; }
      const data = await res.json().catch(() => ({}));
      err.textContent = data.error || 'Something went wrong.';
      document.getElementById('password').value = '';
    } catch {
      err.textContent = 'Network error. Try again.';
    }
    btn.disabled = false; btn.textContent = 'Unlock';
  });
</script>
</body>
</html>
